<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autumn Archives</title>

  <style>

  /* PC用 */
  @media screen and (min-width: 601px) {
    body {
      min-height: 100vh;
    }
  }

  body {
    background-color: black;
    color: white;
    font-family: 'Times New Roman', serif;
    margin: 0;
    padding: 0;

    min-height: 100vh;        /* ← これが中央寄せの本体 */
    display: flex;
    flex-direction: column;
    justify-content: center;  /* ← 上下中央 */
    align-items: center;
    text-align: center;
  }


  h1 {
    font-size: 1.4em;          /* ← Spring と同じ */
    margin-bottom: 0.3em;
    color: rgba(130, 140, 243, 0.801);
    font-weight: normal;
  }

  /* ボタン群（縦並び） */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    margin-top: 1.5em;
  }

  /* 通常ボタン（Spring と同じサイズ） */
  .button {
    display: block;
    padding: 10px 20px;
    background-color: #222;
    color: rgba(130, 140, 243, 0.801);
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s;
    font-weight: normal;
    width: auto;               /* ← 文字幅に合わせる */
    margin: 0 auto;            /* ← 中央寄せ */
  }

  .button:hover {
    background-color: #444;
  }

  /* 中央ボタン（2025 Archives） */
  .center-button {
    margin-top: 2.5em;
    width: auto;               /* ← 横長を防ぐ */
    padding: 10px 20px;
  }

    footer {
    font-size: 0.85em;
    color: rgba(130, 140, 243, 0.801);
    text-align: center;
    margin-top: 3em;
    margin-bottom: 1.5em;
  }
  

  /* スマホ用（巨大化を完全に止める） */
  @media screen and (max-width: 600px) {

    .buttons {
      flex-direction: column;
      gap: 2rem;
      margin-top: 2em;
    }

    .button {
      width: auto;             /* ← 100% を消す！ */
      font-size: 1em;          /* ← Spring と同じ小さめ */
      padding: 10px 20px;      /* ← Spring と同じ */
    }

    .center-button {
      width: auto;
      font-size: 1em;
      padding: 10px 20px;
    }

    h1 {
      font-size: 1.4em;        /* ← Spring と同じ */
    }

          footer {
    margin-top: 1.5em;   /* ← スマホでは余白を半分にする */
  }

  }

  </style>
</head>

<body>

  <h1>Autumn Archives</h1>

  <div class="buttons">
    <a href="Yasukuni-Jinja.html" class="button">Yasukuni Jinja</a>
    <a href="Zojoji.html" class="button">Zojoji</a>
  </div>

  <a href="../2025.html" class="button center-button">2025 Archives</a>

  <footer>© 2026 Sound of Planes<sup>®</sup></footer>

</body>
</html>
