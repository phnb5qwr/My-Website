  body {
    background-color: black;
    color: white;
    font-family: 'Times New Roman', serif;
    margin: 0;
    padding: 0;

    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;   /* ← 中央寄せで静かに */

    text-align: center;

  h1 {

  }

  p {
    color: #8b8bef;
    margin-bottom: 2em;
  }

  /* ボタン群（左右カラム） */
  .buttons {
    display: flex;
    flex-direction: row;
    gap: 3rem;
    align-items: flex-start;
    width: fit-content;
    margin: 0 auto;
    margin-top: 1.5em;         /* ← 呼吸を深く */
  }

  /* 通常ボタン */
  .button {
    display: block;
    margin-bottom: 10px;
    padding: 10px 20px;
    background-color: #222;
    color: rgba(130, 140, 243, 0.801);
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s;
    font-weight: normal;       /* ← 静かに */
  }

  .button:hover {
    background-color: #444;
  }

  /* カラムごとに縦並び */
  .left-column,
  .right-column {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* 中央ボタン（幅は固定しない） */
  .center-button {
    display: block;
    margin: 40px auto 0 auto;
    text-align: center;
    width: auto;
  }

  footer {
    font-size: 0.85em;
    color: rgba(130, 140, 243, 0.801);
    text-align: center;
    margin-top: 3em;           /* ← absolute を外して自然に下へ */
    margin-bottom: 1.5em;
  }

  @media screen and (max-width: 600px) {

    .buttons {
      flex-direction: column;   /* ← 横並びを縦並びにする */
      gap: 1.5rem;              /* ← 呼吸を深く */
      margin-top: 2em;
    }

    .button {
      font-size: 1.2em;         /* ← ボタンの文字を大きく */
      padding: 14px 24px;       /* ← スマホで押しやすく */
      width: 100%;              /* ← ボタンを横幅いっぱいに */
      box-sizing: border-box;
    }

    .left-column,
    .right-column {
      width: 100%;              /* ← カラムをスマホ幅に */
      align-items: center;      /* ← ボタンを中央寄せ */
    }

    .center-button {
      font-size: 1.2em;
      padding: 14px 24px;
      margin-top: 2.5em;
    }

    h1 {
      font-size: 1.8em;         /* ← タイトルをスマホで大きく */
    }

    footer {
      font-size: 1em;           /* ← 読みやすく */
      margin-top: 4em;
    }
  }
