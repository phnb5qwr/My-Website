  <style>

  /* PC用 */
  @media screen and (min-width: 601px) {
    body {
      min-height: 100vh;
    }
  }

  body {
    background-color: black;
    color: white;
    font-family: 'Times New Roman', serif;
    margin: 0;
    padding: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;   /* PCでは中央寄せ */
    align-items: center;
    text-align: center;
  }

  h1 {
    font-size: 1.4em;
    margin-bottom: 0.3em;
    color: rgba(130, 140, 243, 0.801);
    font-weight: normal;
  }

  .buttons {
    display: flex;
    flex-direction: row;
    gap: 3rem;
    align-items: flex-start;
    width: fit-content;
    margin: 0 auto;
    margin-top: 1.5em;
  }

  .button {
    display: block;
    margin-bottom: 10px;
    padding: 10px 20px;
    background-color: #222;
    color: rgba(130, 140, 243, 0.801);
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s;
    font-weight: normal;
  }

  /* スマホ用 */
  @media screen and (max-width: 600px) {
    .buttons {
      flex-direction: column;
      gap: 2rem;
      margin-top: 2em;
    }

    .left-column,
    .right-column {
      width: 100%;
      align-items: center;
    }

    .button {
      width: 100%;
      box-sizing: border-box;
    }
  }

  .button:hover {
    background-color: #444;
  }

  .left-column,
  .right-column {
    width: 250px;   /* Summer と同じ幅 */
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .center-button {
    display: block;
    margin: 40px auto 0 auto;
    text-align: center;
    width: auto;
  }

  footer {
    font-size: 0.85em;
    color: rgba(130, 140, 243, 0.801);
    text-align: center;
    margin-top: 3em;
    margin-bottom: 1.5em;
  }


    footer {
      font-size: 1em;
      margin-top: 4em;
    }
