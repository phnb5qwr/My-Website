<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Archives</title>
  <!-- ここで 2026.css を読み込む -->
<link rel="stylesheet" href="2026.css">

  <style>
.hidden {
  display: none !important;
}

body {
  background-color: black;
  color: white;
  font-family: 'Times New Roman', serif;
  margin: 0;
  padding: 0;

  height: 100vh;              /* PCでは中央寄せ */
  display: flex;
  flex-direction: column;
  justify-content: center;    /* PCでは中央寄せ */
  align-items: center;
  text-align: center;
}

/* PC用 */
@media screen and (min-width: 601px) {
  body {
    height: auto;
    min-height: 100vh;
  }
}

/* スマホ用（2025 と同じ挙動） */
@media screen and (max-width: 600px) {
  body {
    height: auto;            /* ← スマホで圧縮されなくなる */
    min-height: 100vh;       /* ← 自然な縦スクロール */
    justify-content: flex-start; /* ← 中央固定を解除 */
    padding-top: 2.5rem;     /* ← 上に余白 */
  }
}

h1 {
  font-size: 1.4em;
  margin-bottom: 0.3em;
  color: rgba(130, 140, 243, 0.801);
  font-weight: normal;
}

.buttons {
  display: flex;
  gap: 1rem;
  justify-content: center !important;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 1.5em;
}

.spacer {
  flex-basis: 100%;
  height: 9px;
}

/* スマホでは spacer を消す */
@media screen and (max-width: 600px) {
  .spacer {
    display: none;
  }

  .buttons {
    flex-direction: column;
    align-items: center;
    padding: 0;
    gap: 1rem;
    width: 100%;
  }

  a.button {
    display: block;
    margin-left: auto;
    margin-right: auto;
    width: auto;
    min-width: 120px;
    text-align: center;
  }
}

a.button {
  padding: 10px 20px;
  background-color: #222;
  color: rgba(130, 140, 243, 0.801);
  text-decoration: none;
  border-radius: 5px;
  transition: background-color 0.3s;
  font-weight: normal;
}

a.button:hover {
  background-color: #444;
}

footer {
  font-size: 0.85em;
  color: rgba(130, 140, 243, 0.801);
  text-align: center;
  margin-top: 3em;
  margin-bottom: 1.5em;
}

</style>
</head>
<body>

  <h1>2026 Archives</h1>

  <div class="buttons">

<a href="../2026/Spring/Spring.html" class="button">Spring</a>
<a href="../2026/Summer/Summer.html" class="button hidden">Summer</a>

<a href="../2026/Winter-Late/Winter-Late.html" class="button hidden">Winter (Late)</a>

    <div class="spacer"></div>

    <a href="../records.html" class="button">Back to Yearly Records</a>
  </div>

  <footer>© 2026 Sound of Planes<sup>®</sup></footer>

</body>
</html>
