<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Archives</title>
  <!-- ここで 2026.css を読み込む -->
<link rel="stylesheet" href="2026.css">

  <style>
  .hidden {
  display: none !important;
}

    /* PC用 */
  @media screen and (min-width: 601px) {
    body {
      height: auto;        /* ← これが決定打 */
      min-height: 100vh;
    }
  }

  body {
    background-color: black;
    color: white;
    font-family: 'Times New Roman', serif;
    margin: 0;
    padding: 0;

    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;   /* ← 中央寄せで静かに */
    align-items: center;
    text-align: center;
  }

  h1 {
    font-size: 1.4em;          /* ← 控えめで上品に */
    margin-bottom: 0.3em;
    color: rgba(130, 140, 243, 0.801);
    font-weight: normal;
  }

  p {
    color: #8b8bef;
    margin-bottom: 2em;
  }

  .buttons {
    display: flex;
    gap: 1rem;
    justify-content: center !important;   /* ← これが決定打 */
    align-items: center;
    flex-wrap: wrap;
    margin-top: 1.5em;         /* ← 呼吸を深く */
  }

  a.button {
    padding: 10px 20px;
    background-color: #222;
    color: rgba(130, 140, 243, 0.801);
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s;
    font-weight: normal;       /* ← 静かに */
  }

  /* ← ここに追加するだけでスマホが綺麗になる */
  a.button {
    min-width: 120px;
    text-align: center;
  }

  @media screen and (max-width: 600px) {
    .buttons {
      flex-direction: column;
      align-items: center;   /* ← 中央寄せ */
      padding: 0;            /* ← 右寄りの原因を消す */
      gap: 1rem;
      width: 100%;   /* ← これが決定打 */
    }

    a.button {
      display: block;        /* ← これが本当に必要だった！ */
      margin-left: auto;
      margin-right: auto;   /* ← これで中央に固定される */
      width: auto;          /* ← サイズはそのまま */
      min-width: 120px;
      text-align: center;
    }
  }

  a.button:hover {
    background-color: #444;
  }

  footer {
    font-size: 0.85em;
    color: rgba(130, 140, 243, 0.801);
    text-align: center;
    margin-top: 3em;
    margin-bottom: 1.5em;
  }
  </style>
</head>
<body>

  <h1>2026 Archives</h1>

  <div class="buttons">

<a href="../2026/Spring/Spring.html" class="button hidden">Spring</a>
<a href="../2026/Summer/Summer.html" class="button hidden">Summer</a>
<a href="../2026/Autumn/Autumn.html" class="button hidden">Autumn</a>
<a href="../2026/Winter-Late/Winter-Late.html" class="button hidden">Winter (Late)</a>

    <div style="flex-basis:100%; height: 9px;"></div>

    <a href="../records.html" class="button">Back to Yearly Records</a>
  </div>

  <footer>© 2026 Sound of Planes<sup>®</sup></footer>

</body>
</html>
