<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Records</title>
  <style>
   @media screen and (min-width: 601px) {
  body {
    min-height: 100vh;   /* ← PCだけ中央寄せを維持する */
  }
}
  
    body {
      background-color: black;
      color: white;
      font-family: 'Times New Roman', serif;
      margin: 0;
      padding: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;   /* ← 中央寄せで静かに */
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 1.4em;          /* ← 控えめで上品に */
      margin-bottom: 0.3em;
      color: rgba(130, 140, 243, 0.801);
      font-weight: normal;
    }

    p {
      color: #8b8bef;
      margin-bottom: 2em;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 1.5em;         /* ← 呼吸を深く */
    }

    a.button {
      padding: 10px 20px;
      background-color: #222;
      color: rgba(130, 140, 243, 0.801);
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
      font-weight: normal;       /* ← 静かに */
    }

    a.button:hover {
      background-color: #444;
    }

    footer {
      font-size: 0.85em;
      color: rgba(130, 140, 243, 0.801);
      text-align: center;
      margin-top: 3em;           /* ← absolute を外して自然に下へ */
      margin-bottom: 1.5em;
    }

    @media screen and (max-width: 600px) {

    .buttons {
      flex-direction: column;   /* ← 横並びを縦並びにする */
      gap: 1.5rem;              /* ← 呼吸を深く */
      margin-top: 2em;
    }

    .button {
      font-size: 1.2em;         /* ← ボタンの文字を大きく */
      padding: 14px 24px;       /* ← スマホで押しやすく */
      width: 100%;              /* ← ボタンを横幅いっぱいに */
      box-sizing: border-box;
    }

    .left-column,
    .right-column {
      width: 100%;              /* ← カラムをスマホ幅に */
      align-items: center;      /* ← ボタンを中央寄せ */
    }

    .center-button {
      font-size: 1.2em;
      padding: 14px 24px;
      margin-top: 2.5em;
    }

    h1 {
      font-size: 1.8em;         /* ← タイトルをスマホで大きく */
    }

    footer {
      font-size: 1em;           /* ← 読みやすく */
      margin-top: 4em;
    }
    }

  </style>
</head>
<body>

  <h1>Archived Records</h1>

  <div class="buttons">
    <a href="2024/2024.html" class="button">Year 2024</a>
    <a href="2025/2025.html" class="button">Year 2025</a>
    <a href="2026/2026.html" class="button">Year 2026</a>

    <div style="flex-basis:100%; height: 9px;"></div>

    <a href="void.html" class="button">Back to Silence</a>
  </div>

  <footer>© 2026 Sound of Planes<sup>®</sup></footer>

</body>
</html>
