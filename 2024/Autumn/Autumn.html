<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autumn Archives</title>
  <style>
 
 @media screen and (min-width: 601px) {
  body {
    min-height: 100vh;   /* ← PCだけ中央寄せを維持する */
  }
}

  body {
    background-color: black;
    color: white;
    font-family: 'Times New Roman', serif;
    margin: 0;
    padding: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;   /* ← 中央寄せで静かに */
    align-items: center;
    text-align: center;
  }

  h1 {
    font-size: 1.4em;          /* ← 控えめで上品に */
    margin-bottom: 0.3em;
    color: rgba(130, 140, 243, 0.801);
    font-weight: normal;
  }

  p {
    color: #8b8bef;
    margin-bottom: 2em;
  }

  /* ボタン群（左右カラム） */
  .buttons {
    display: flex;
    flex-direction: row;
    gap: 3rem;
    align-items: flex-start;
    width: fit-content;
    margin: 0 auto;
    margin-top: 1.5em;         /* ← 呼吸を深く */
  }

  .button {
    display: block;
    margin-bottom: 10px;
    padding: 10px 20px;
    background-color: #222;
    color: rgba(130, 140, 243, 0.801);
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s;
    font-weight: normal;       /* ← 静かに */
  }

    /* スマホ用（最後に置く） */
  @media screen and (max-width: 600px) {
    .buttons {
      flex-direction: column;
      gap: 2rem;
      margin-top: 2em;
      width: 100%;        /* ← これが決定的 */
      padding: 0 1rem;    /* ← 静けさの余白 */
    }

    .left-column,
    .right-column {
      align-items: center;
      width: 100%;        /* ← カラムも中央寄せ */
    }

    .button {
      width: 100%;
      box-sizing: border-box;
    }
  }

  .button:hover {
    background-color: #444;
  }

  /* カラムごとに縦並び */
  .left-column,
  .right-column {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* 中央ボタン（幅は固定しない） */
  .center-button {
    display: block;
    margin: 40px auto 0 auto;
    text-align: center;
    width: auto;
  }

  footer {
    font-size: 0.85em;
    color: rgba(130, 140, 243, 0.801);
    text-align: center;
    margin-top: 3em;           /* ← absolute を外して自然に下へ */
    margin-bottom: 1.5em;
  }


  </style>
</head>
